# SPDX-License-Identifier: GPL-2.0-or-later
#
# Builds a sideloadable, unsigned Andarium IPA on a macOS runner: the Android
# runtime frameworks, the vendored idevice xcframework for the built-in JIT,
# and the application. It downloads the accepted kernel bundle and Android
# system release from the upstream Kernarium releases, because building those
# needs a large Linux farm; everything else is built from this tree.
#
# It is heavy (Mesa/KosmicKrisp and the GPU stack build from source) and runs
# only when started by hand. The IPA it uploads is unsigned: sideload it with a
# tool that re-signs for your device (AltStore, SideStore, …) and with the
# Increased Memory Limit and Extended Virtual Addressing entitlements. The
# built-in JIT then couples in Settings.

name: Build Andarium IPA

on:
  workflow_dispatch:
    inputs:
      kernel_asset_url:
        description: Accepted Android kernel bundle (.tar.gz) from Kernarium releases
        default: https://github.com/imxieyi/Kernarium/releases/download/1.0b15-release/android-6.18-arm64-4k-20261117-6.18.60-vd2.tar.gz
      system_asset_url:
        description: Accepted LineageOS 24 system release (.tar.gz) from Kernarium releases
        default: https://github.com/imxieyi/Kernarium/releases/download/1.0b15-release/lineage24-mainline6.18-4k-20261115-los24-r28.tar.gz

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson bison flex pkg-config nasm \
            autoconf automake libtool gettext
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Add the iOS Rust target
        run: |
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Set up the GPU build venv (meson + Mesa Python modules)
        run: |
          set -eux
          python3 -m venv .build/gpu-tools-venv
          .build/gpu-tools-venv/bin/pip install --upgrade pip
          .build/gpu-tools-venv/bin/pip install meson mako packaging pyyaml
          # build-apple-gpu.sh prefers this venv's meson and resolves python3
          # from it, so KosmicKrisp finds mako, packaging and yaml.
          .build/gpu-tools-venv/bin/python -c 'import mako, packaging, yaml'
          # Mesa's glcpp/GLSL grammars need Bison 3; macOS ships Bison 2.3 at
          # /usr/bin. This venv's bin is first on Mesa's tool path, so a Bison 3
          # (and flex) symlink here is used by both the Vulkan and OpenGL passes.
          ln -sf "$(brew --prefix bison)/bin/bison" .build/gpu-tools-venv/bin/bison
          ln -sf "$(brew --prefix flex)/bin/flex" .build/gpu-tools-venv/bin/flex
          .build/gpu-tools-venv/bin/bison --version | head -1

      - name: Restore the dependency source and git cache
        uses: actions/cache/restore@v4
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: deps-src-${{ hashFiles('dependencies/manifest.tsv') }}-${{ github.run_id }}
          restore-keys: |
            deps-src-${{ hashFiles('dependencies/manifest.tsv') }}-
            deps-src-

      - name: Seed glib and gvdb from GNOME's GitHub mirror
        run: |
          set -eux
          # gitlab.gnome.org persistently returns 503 to the runners. Seed the
          # pinned glib and gvdb commits into prepare.sh's Git cache from
          # GNOME's reliable GitHub mirror, keeping the origin URL the manifest
          # records (so prepare.sh's origin check passes and it does not refetch
          # from gitlab). The pinned commit is still verified downstream, so the
          # provenance is unchanged; only the transport of the objects differs.
          seed() { # name gitlab-url mirror-url commit
            d=".build/dependency-cache/git/$1"
            if git -C "$d" cat-file -e "$4^{commit}" 2>/dev/null \
               && [ "$(git -C "$d" remote get-url origin 2>/dev/null)" = "$2" ]; then
              return 0
            fi
            rm -rf "$d"; mkdir -p "$d"; git -C "$d" init -q
            git -C "$d" remote add origin "$2"
            git -C "$d" fetch --no-tags --depth 1 "$3" "$4"
            git -C "$d" update-ref refs/heads/uml-pin "$4"
          }
          seed glib-ios https://gitlab.gnome.org/GNOME/glib.git \
            https://github.com/GNOME/glib.git e05063ccc6c8f222465a1080927f4c14349f3de6
          seed gvdb https://gitlab.gnome.org/GNOME/gvdb.git \
            https://github.com/GNOME/gvdb.git 2b42fc75f09dbe1cd1057580b5782b08f2dcb400

      - name: Prepare and build the iOS dependency prefixes
        run: |
          set -eux
          # dependencies/prepare.sh fetches pinned commits from upstream hosts,
          # which can still return a transient 503. Retry a few times; it
          # resumes from the git cache and verifies, so a repeat is cheap.
          prepare() {
            for attempt in 1 2 3 4 5; do
              if dependencies/prepare.sh "$@"; then return 0; fi
              echo "prepare.sh $* failed (attempt $attempt); retrying in 20s" >&2
              sleep 20
            done
            echo "prepare.sh $* failed after retries" >&2
            return 1
          }
          prepare --product ios-compression
          dependencies/build-ios-zstd.sh
          prepare --product ios-storage
          dependencies/build-ios-storage.sh
          prepare --product ios-network
          dependencies/build-ios-network.sh --platform ios
          prepare --product apple-gpu-vulkan-experiment
          dependencies/build-apple-gpu.sh --platform ios

      - name: Save the dependency source and git cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: deps-src-${{ hashFiles('dependencies/manifest.tsv') }}-${{ github.run_id }}

      - name: Install the accepted Android kernel bundle
        run: |
          set -eux
          mkdir -p .build/kernel/artifacts
          curl -fL "${{ inputs.kernel_asset_url }}" -o kernel-bundle.tar.gz
          tar -xzf kernel-bundle.tar.gz -C .build/kernel/artifacts
          ls .build/kernel/artifacts

      - name: Install the accepted Android system release
        run: |
          set -eux
          mkdir -p .build/release-download
          curl -fL "${{ inputs.system_asset_url }}" -o system-release.tar.gz
          tar -xzf system-release.tar.gz -C .build/release-download
          release_dir="$(find "$PWD/.build/release-download" -maxdepth 1 -mindepth 1 -type d | head -1)"
          python3 android/lineage-24/tools/install-release.py --source "$release_dir"

      - name: Build the Android runtime and package the frameworks
        run: |
          set -eux
          cmake --preset kernarium-ios-device-android
          cmake --build --preset kernarium-ios-device-android
          Kernarium/scripts/package-ios-frameworks.sh --runtimes android

      - name: Build the idevice xcframework (built-in JIT)
        run: |
          set -eux
          OUT="$PWD/.build/idevice" IDEVICE_SRC="$PWD/.build/idevice/src" \
            Andarium/ThirdParty/idevice/build-idevice-xcframework.sh
          ls .build/idevice

      - name: Stage the Android system image
        run: |
          set -eux
          python3 Andarium/scripts/stage-system-image.py

      - name: Build Andarium (unsigned)
        run: |
          set -eux
          xcodebuild \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build

      - name: Package the IPA
        run: |
          set -eux
          app="$(find .build/DerivedData/Build/Products -maxdepth 2 -name 'Andarium.app' -type d | head -1)"
          [ -n "$app" ] || { echo 'Andarium.app was not built' >&2; exit 1; }
          rm -rf .build/ipa && mkdir -p .build/ipa/Payload
          cp -R "$app" .build/ipa/Payload/
          ( cd .build/ipa && zip -qry ../Andarium-unsigned.ipa Payload )
          ls -lh .build/Andarium-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-unsigned-ipa
          path: .build/Andarium-unsigned.ipa
          if-no-files-found: error
